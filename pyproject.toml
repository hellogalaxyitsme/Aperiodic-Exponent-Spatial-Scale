[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apex"
version = "1.0.0"
description = "Derivation-dependent aperiodic exponents in intracranial and scalp recordings: analysis library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy", "scipy", "pandas", "joblib", "mne", "specparam==2.0.0rc6", "statsmodels", "scikit-learn",
    "h5py", "torch", "PyYAML", "matplotlib", "pymatreader",
]

[tool.setuptools.packages.find]
where = ["src"]
